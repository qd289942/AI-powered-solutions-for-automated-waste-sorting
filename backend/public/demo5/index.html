    <div><span>Operation Section: </span><span id="operationSection"></span></div>
    <div id="actuatorBlock" style="display: flex; flex-direction: column; max-width: 300px;"></div>

        async function init() {

            const res =  await fetch('http://localhost:3000/ai/')
            const ais = await res.json()
            const yoloRemote = ais.find(ai => ai.name === 'YoloV8_detection_v3_remote')

            const oeprationSectionToInsert = {
                                    "name": "socket_io_multiple_actuator",
                                    "conveyerSpeed": 2072.4,
                                    "cameraXThreshold": 50,
                                    "detectionMinThreshold": 0.6,
                                    "cameraPictureWidthMm": 180,
                                    "aiId": yoloRemote.aiId,
                                    "actuators": [
                                        {
                                        "name": "Actuator1",
                                        "cameraDistance": 130,
                                        "type": "COMPRESSED_AIR",
                                        "activationTrashLabel": [ "plastic" ]
                                        },
                                        {
                                        "name": "Actuator2",
                                        "cameraDistance": 340,
                                        "type": "COMPRESSED_AIR",
                                        "activationTrashLabel": [ "metal" ]
                                        }
                                    ]
                                }

                                        // check if it already exists
            fetch(`http://localhost:3000/operation-sections?name=socket_io_multiple_actuator`).then(async (response) => {
                const operationSection = await response.json();
                console.log(operationSection);
                handleResponse(operationSection)
            }).catch((error) => {
                postData("http://localhost:3000/operation-sections", oeprationSectionToInsert).then(async (response) => {
                handleResponse(response)
            })});
        }

        
        
        function handleResponse(operationSection) {
            
                /*

                    Example Respone of a Operation Section 
                    {
                        "operationSectionId": 15,
                        "name": "test1",
                        "conveyerSpeed": 15,
                        "cameraXThreshold": 50,
                        "aiId": 3,
                        "actuators": [
                            {
                                "actuatorId": 20,
                                "name": "Actuator1",
                                "type": "COMPRESSED_AIR",
                                "cameraDistance": 50,
                                "activationTrashLabel": [
                                    "metal"
                                ],
                                "operationSectionId": 15
                            },
                            {
                                "actuatorId": 21,
                                "name": "Actuator2",
                                "type": "COMPRESSED_AIR",
                                "cameraDistance": 75,
                                "activationTrashLabel": [
                                    "Plastic"
                                ],
                                "operationSectionId": 15
                            }
                        ]
                        }
                */

                /*  
                    Hier können wir ggf. noch einen Kamera Prefix einbauen, sodass man sich speziell auf die Events
                    einer Kamera subscriben kann.
                */
                const socket = io();

                console.log(operationSection.actuators);
                const actuatorBlock = document.getElementById('actuatorBlock')
                const osDiv = document.getElementById('operationSection')
                osDiv.innerText = operationSection.operationSectionId;
                operationSection.actuators.forEach(actuator => {
                    
                    const actuatorHTML = 
                            `<div><label for="actuator${actuator.actuatorId}">Actuator ${actuator.actuatorId}</label>
                            <input type="radio" id="${actuator.actuatorId}" value="${actuator.actuatorId}">${actuator.activationTrashLabel}</div>`
                        
                        
                        const template = document.createElement('template');
                        template.innerHTML = actuatorHTML;
                        const result = template.content.children
                        console.log(...result);
                        actuatorBlock.append(...result)

                    socket.on(`trash_detected/${actuator.actuatorId}`, function(detectionData) {
                        console.log(`Got action signal from server for actuator ${actuator.actuatorId}}]`, detectionData);
                        
                        const htmlActuator = document.getElementById(actuator.actuatorId);
                        htmlActuator.checked = true;

                        //signal duration
                        setTimeout(() => {
                            htmlActuator.checked = false;
                        }, 3000);
                    });
                });
               
        }

        init();
        

     
    </script>
</body>
